[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrise-qurious-predictor"
version = "0.4.0"
description = "Offline predictor of the next Qurious armor augments for Monster Hunter Rise: Sunbreak (Steam saves)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mhrise-exporter @ git+https://github.com/Gustavo-Ragazzi/mhrise-exporter@c2f578767972b6f7afb0227f90814adaeda95774",
    "pywebview>=5", "texture2ddecoder>=1.0", "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.urls]
Homepage = "https://github.com/Gustavo-Ragazzi/mhrise-qurious-predictor"

[project.gui-scripts]
mhrise-qurious-predictor = "qurious_predictor.app:main"

[tool.setuptools]
packages = ["qurious_predictor"]

[tool.setuptools.package-data]
qurious_predictor = ["web/*.html"]
