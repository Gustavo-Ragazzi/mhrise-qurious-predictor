[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mhrise-qurious-predictor"
version = "0.14.0"
description = "Offline predictor of the next Qurious armor augments and melded talismans, with a set builder for Monster Hunter Rise: Sunbreak (Steam saves)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mhrise-exporter @ git+https://github.com/Gustavo-Ragazzi/mhrise-exporter@c2f578767972b6f7afb0227f90814adaeda95774",
    "pywebview>=5", "texture2ddecoder>=1.0", "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6", "maturin>=1.7,<2"]

[project.urls]
Homepage = "https://github.com/Gustavo-Ragazzi/mhrise-qurious-predictor"

[project.gui-scripts]
mhrise-qurious-predictor = "qurious_predictor.app:main"

[tool.maturin]
# The Rust engine (native/core) is built into qurious_predictor/_native via the PyO3 bindings.
manifest-path = "native/py/Cargo.toml"
module-name = "qurious_predictor._native"
profile = "release"
