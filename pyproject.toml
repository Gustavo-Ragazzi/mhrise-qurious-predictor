[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrise-qurious-predictor"
version = "0.1.0"
description = "Offline predictor of the next Qurious armor augments for Monster Hunter Rise: Sunbreak (Steam saves)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mhrise-exporter", "pywebview>=5", "texture2ddecoder>=1.0", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
mhrise-qurious-predictor = "qurious_predictor.app:main"

[tool.setuptools]
packages = ["qurious_predictor"]

[tool.setuptools.package-data]
qurious_predictor = ["web/*.html"]
