<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH Rise Qurious Predictor</title>
<style>
:root {
  --bg: #14110d; --bg2: #1b1712; --panel: #211c15; --panel2: #2a231a; --line: #4a3d2a; --line2: #6e5a38;
  --gold: #e8c47c; --gold2: #b8924f; --text: #efe6d2; --muted: #a39780; --dim: #5e5546;
  --up: #6fe07c; --down: #f06a5a; --sel: #3a2f1f; --hover: #2d261b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.35 "Segoe UI", "Noto Sans", system-ui, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(ellipse at top, #241d14 0%, var(--bg) 60%); }
button, input, select { font: inherit; color: var(--text); }
.frame { border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel2), var(--panel));
  border-radius: 6px; box-shadow: inset 0 0 0 1px #00000060, 0 2px 10px #0008; }
.frame > h2 { margin: 0; padding: 7px 12px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); border-bottom: 1px solid var(--line); background: linear-gradient(90deg, #3b2f1d, transparent); }

/* top bar */
header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line2);
  background: linear-gradient(180deg, #2c2418, #1a1510); }
header .title { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: .04em; margin-right: 10px;
  text-shadow: 0 1px 0 #000; }
header label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
select, input[type=text], input[type=number] { background: #120f0b; border: 1px solid var(--line2); border-radius: 4px;
  height: 32px; padding: 0 8px; }
input[type=number] { width: 80px; }
select:focus, input:focus { outline: 1px solid var(--gold); }
.btn { background: linear-gradient(180deg, #3c3120, #2a2216); border: 1px solid var(--line2); border-radius: 4px;
  height: 32px; padding: 0 12px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.spacer { flex: 1; }

main { flex: 1; display: grid; grid-template-columns: 440px minmax(0, 1fr); gap: 10px; padding: 10px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }

/* armor list */
.filters { padding: 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.filters input { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: #17130e; border-radius: 4px; height: 30px; min-width: 34px;
  padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
  color: var(--muted); }
.chip.on { border-color: var(--gold); color: var(--gold); background: #2e2517; }
.list { overflow: auto; flex: 1; }
.armor { display: grid; grid-template-columns: 28px 1fr auto; align-items: start; gap: 8px; padding: 7px 10px;
  border-bottom: 1px solid #2c251a; cursor: pointer; }
.armor > .tint { margin-top: 1px; }
.armor:hover { background: var(--hover); }
.armor.sel { background: linear-gradient(90deg, #4a3a20, var(--sel)); box-shadow: inset 3px 0 0 var(--gold); }
.armor .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.armor .sub { display: flex; gap: 2px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 1px; }
.armor .askills { display: flex; flex-wrap: wrap; gap: 1px 10px; font-size: 12.5px; color: var(--text); margin-top: 2px; }
.armor .askills .sk { margin: 0; gap: 3px; }
.armor .askills .tint { width: 18px; height: 18px; }
.armor .askills b { color: var(--gold); font-weight: 600; }
.armor .own { font-size: 12px; color: var(--up); white-space: nowrap; }
.group { position: sticky; top: 0; z-index: 1; padding: 4px 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); background: linear-gradient(90deg, #3b2f1d, #1d1811); border-bottom: 1px solid var(--line2); }
.group span { color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
.cost { font-size: 12px; color: var(--gold2); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.rar { font-size: 12px; color: var(--gold); border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
.modes { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line2); background: #15110c; }
.small { font-size: 12px; }
.wts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.wts label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--gold2); text-transform: uppercase; letter-spacing: .04em; }
.wts input { width: 100%; height: 28px; padding: 0 6px; }
.pskill { display: grid; grid-template-columns: 24px 1fr 74px 46px; align-items: center; gap: 6px; padding: 4px 10px;
  border-bottom: 1px solid #2c251a; }
.pskill:hover { background: var(--hover); }
.pskill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pskill .tier { font-size: 11px; color: var(--muted); }
.pskill input { width: 100%; height: 26px; padding: 0 6px; text-align: right; }
.pskill input.set { border-color: var(--gold); color: var(--gold); }
.pskill .reset { all: unset; cursor: pointer; font-size: 11px; color: var(--gold2); text-align: center; }
.pskill .reset:hover { color: var(--gold); }
.pskill.ro input { opacity: .75; }
.modal { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 30; }
.modal .box { width: min(720px, 92vw); display: flex; flex-direction: column; }
.modal textarea { margin: 10px; height: 52vh; resize: vertical; background: #120f0b; border: 1px solid var(--line2); border-radius: 4px;
  color: var(--text); font: 13px/1.4 Consolas, "Cascadia Mono", monospace; padding: 8px; }
.modal .frow { padding: 0 10px 10px; }
td.sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--gold); }
td.gn { text-align: right; font-variant-numeric: tabular-nums; }
th.click { cursor: pointer; }
.mode { padding: 7px 16px; cursor: pointer; border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0;
  color: var(--muted); background: #18140f; font-weight: 600; letter-spacing: .03em; }
.mode.on { color: var(--gold); background: linear-gradient(180deg, #4a3b22, #2a2216); border-color: var(--line2); }
.or { color: var(--gold2); font-size: 12px; font-style: italic; margin: 0 2px; }
.and { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
td.arm { white-space: nowrap; }
td.arm .opt { color: var(--gold2); font-size: 12px; margin-left: 26px; }
td.arm .base { display: flex; flex-wrap: wrap; gap: 0 8px; margin: 2px 0 0 26px; font-size: 12px; color: var(--muted); }
td.arm .base .sk { margin: 0; gap: 3px; }
td.arm .base .tint { width: 16px; height: 16px; }
td.arm .base .bslots { display: inline-flex; align-items: center; }
td.arm .base .bslots .tint { width: 18px; height: 18px; }
td.arm .base .bslots .slot-empty { width: 12px; height: 12px; margin: 3px; }
#table.all td.skills { min-width: 0; }
#table.all .res { margin-right: 0; }
#table.all td { padding: 4px 5px; }
#table.all td.skills .sk { margin-right: 8px; }
#table.all .res .val { min-width: 16px; }
td.arm .nm { font-weight: 600; }
tr.click { cursor: pointer; }

/* icons */
.ico { display: inline-block; width: 20px; height: 20px; vertical-align: middle; flex: none;
  -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
.tint { position: relative; display: inline-block; width: 22px; height: 22px; vertical-align: middle; flex: none; isolation: isolate; }
.tint > span { position: absolute; inset: 0; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; }
.tint > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.img { width: 22px; height: 22px; object-fit: contain; vertical-align: middle; flex: none; }
.off { opacity: .28; filter: grayscale(1); }
.slot-empty { display: inline-block; width: 14px; height: 14px; border: 1px dashed var(--dim); border-radius: 50%;
  vertical-align: middle; margin: 3px; }

/* right side */
.head { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; border-bottom: 1px solid var(--line); }
.head .big { font-size: 18px; font-weight: 700; color: var(--gold); }
.head .note { width: 100%; color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line2); }
.tab { border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0; padding: 7px 14px; cursor: pointer;
  background: #18140f; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.tab.on { background: linear-gradient(180deg, #4a3b22, #2a2216); color: var(--gold); border-color: var(--line2); }
.badge { font-size: 11px; background: #0d0b08; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; color: var(--up); }
.want { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line2); border-radius: 12px;
  padding: 1px 4px 1px 6px; background: #241d13; }
.want button { all: unset; cursor: pointer; color: var(--muted); padding: 0 4px; }
.want button:hover { color: var(--down); }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
.table { overflow: auto; flex: 1; }
table { border-collapse: collapse; width: 100%; }
th { position: sticky; top: 0; z-index: 1; background: #231c13; color: var(--gold2); font-weight: 600; text-align: left;
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line2); }
td { padding: 4px 8px; border-bottom: 1px solid #2a2319; vertical-align: middle; white-space: nowrap; }
tr.match td { background: #1f2a17; }
tbody tr:hover td, tbody tr.match:hover td { background: #4a3c22; }
tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
tr.match td:first-child { box-shadow: inset 3px 0 0 var(--up); }
td.n { color: var(--muted); width: 48px; text-align: right; }
.val { display: inline-block; min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.pos { color: var(--up); } .neg { color: var(--down); } .zero { color: var(--dim); }
.res { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; }
td.skills { white-space: normal; min-width: 260px; }
td.skills .sk { white-space: nowrap; margin: 1px 12px 1px 0; }
.res .val { min-width: 18px; text-align: left; }
.sk { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
.sk.wanted .nm { color: var(--up); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.muted { color: var(--muted); }
#status { padding: 4px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: #110e0a; }
.loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000a;
  color: var(--gold); font-size: 16px; z-index: 5; }
.slots .tint { width: 26px; height: 26px; margin-right: 1px; }
.slots .slot-empty { width: 18px; height: 18px; margin: 4px; }
/* filter bar */
.filterbar { display: flex; flex-direction: column; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #1d1812, #18140f); }
.frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flabel { color: var(--gold2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.btn.gold { background: linear-gradient(180deg, #8a6a2c, #5d461b); border-color: var(--gold); color: #fff3d6; font-weight: 600; }
.wantlist { display: inline-flex; flex-wrap: wrap; gap: 6px; }

/* custom dropdown */
.picker { position: relative; display: inline-block; }
.picker-btn { width: 100%; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 28px 0 8px;
  background: linear-gradient(180deg, #2b2318, #1a150f); border: 1px solid var(--line2); border-radius: 4px;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.picker-btn:hover, .picker.open .picker-btn { border-color: var(--gold); }
.picker-btn::after { content: ""; position: absolute; right: 10px; top: 12px; border: 5px solid transparent;
  border-top-color: var(--gold); }
.picker.open .picker-btn::after { top: 7px; border-top-color: transparent; border-bottom-color: var(--gold); }
.picker-btn .ph { color: var(--muted); }
.picker-pop { position: absolute; z-index: 20; top: calc(100% + 3px); left: 0; min-width: 100%; max-height: 360px;
  display: flex; flex-direction: column; background: #16120d; border: 1px solid var(--gold2); border-radius: 5px;
  box-shadow: 0 8px 24px #000c, inset 0 0 0 1px #00000080; }
.picker-pop input { margin: 6px; height: 30px; }
.picker-list { overflow: auto; padding: 2px 0 4px; }
.picker-item { display: flex; align-items: center; gap: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.picker-item:hover, .picker-item.active { background: linear-gradient(90deg, #4a3a20, #2a2216); }
.picker-item.sel { color: var(--gold); }
.picker-item.disabled { color: var(--dim); cursor: not-allowed; }
.picker-item.disabled:hover { background: none; }
.picker-item .hint { margin-left: auto; color: var(--muted); font-size: 12px; padding-left: 10px; }
.picker-empty { padding: 8px 10px; color: var(--muted); }
.slotpick { width: 96px; }

/* toggles */
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle span { width: 32px; height: 18px; border-radius: 9px; background: #120f0b; border: 1px solid var(--line2);
  position: relative; transition: .15s; }
.toggle span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--muted); transition: .15s; }
.toggle input:checked + span { background: #3d5a2a; border-color: var(--up); }
.toggle input:checked + span::after { left: 16px; background: var(--up); }
.perf { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; width: 132px; }
.pbar { width: 84px; height: 9px; background: #0d0b08; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.pbar span { display: block; height: 100%; }
.pct { font-size: 12px; font-variant-numeric: tabular-nums; min-width: 34px; }
.god { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #1a1208; padding: 0 5px; border-radius: 3px;
  background: linear-gradient(180deg, #ffe9a8, #d9a63c); box-shadow: 0 0 6px #e8c47c99; }
.psegs { display: flex; gap: 3px; width: 84px; }
.pseg { flex: 1; height: 5px; border-radius: 2px; background: linear-gradient(90deg, var(--gold) var(--f), #3a3022 var(--f)); }
</style>
</head>
<body>
<header>
  <span class="title">Qurious Predictor</span>
  <label for="hunter">Hunter</label><select id="hunter"></select>
  <button class="btn" id="reload" title="Read the save again (save in game first)">Reload save</button>
  <span class="spacer"></span>
  <label for="rolls">Rolls</label><input id="rolls" type="number" min="1" max="1000" step="10">
  <label for="lang">Names</label><select id="lang"></select>
  <button class="btn" id="gamedir">Game folder…</button>
</header>
<nav class="modes" id="modes">
  <span class="mode" data-mode="piece">Selected piece</span>
  <span class="mode" data-mode="all">Search all listed armor</span>
  <span class="mode" data-mode="rank">Ranking</span>
  <span class="mode" data-mode="talisman">Talismans</span>
</nav>
<main>
  <section class="frame col" id="listcol">
    <h2 id="listtitle">Armor</h2>
    <div class="filters">
      <input id="afilter" type="text" placeholder="Search armor or skill…">
      <div class="chips" id="parts"></div>
      <div class="frow"><div class="chips" id="rarities"></div><span class="spacer"></span>
        <label class="toggle" title="Only pieces you have crafted"><input type="checkbox" id="ownedonly"><span></span>Crafted only</label></div>
    </div>
    <div class="list" id="armors"></div>
  </section>
  <section class="frame col" id="presetcol" style="display:none">
    <h2>Search presets</h2>
    <div class="filters">
      <div class="picker" id="presetpick" style="width:100%"></div>
      <div class="frow">
        <button class="btn" id="pnew" title="New preset, every weight 0">New</button>
        <button class="btn" id="pclone" title="Copy this preset to edit it">Clone</button>
        <button class="btn" id="pdelete">Delete</button>
        <span class="spacer"></span>
        <button class="btn" id="pimport" title="Paste a preset as text">Import</button>
        <button class="btn" id="pexport" title="Copy this preset as text">Export</button>
      </div>
      <input id="presetname" type="text" placeholder="Preset name">
      <div id="presetnote" class="muted small"></div>
      <div class="wts">
        <label>New slot<input type="number" step="0.5" id="sw0"></label>
        <label>Slot Lv1→2<input type="number" step="0.5" id="sw1"></label>
        <label>Slot Lv2→3<input type="number" step="0.5" id="sw2"></label>
        <label>Slot Lv3→4<input type="number" step="0.5" id="sw3"></label>
        <label>Defense / pt<input type="number" step="0.1" id="dw"></label>
      </div>
      <div class="frow"><input id="pskfilter" type="text" placeholder="Search skill…" style="flex:1">
        <label class="toggle"><input type="checkbox" id="weightedonly"><span></span>Weighted only</label></div>
    </div>
    <div class="list" id="pskills"></div>
  </section>
  <section class="frame col" id="rightcol">
    <div class="head" id="head"><span class="muted">Select an armor piece.</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="filterbar" id="rankbar" style="display:none">
      <div class="frow">
        <span class="flabel">Pieces</span>
        <div class="chips" id="rparts"></div><div class="chips" id="rrarities"></div>
        <label class="toggle" title="Only pieces you have crafted"><input type="checkbox" id="rownedonly"><span></span>Crafted only</label>
      </div>
      <div class="frow">
        <span class="flabel">Options</span>
        <div class="chips" id="rtypes"></div>
        <span class="flabel">Min score</span>
        <input id="rminscore" type="number" step="1" placeholder="any" style="width:84px" title="Hide results with a lower score">
      </div>
      <div class="frow">
        <span class="flabel">Rolls per option</span>
        <input id="rankdepth" type="number" min="1" max="100000" step="50" style="width:92px">
        <span class="flabel">Rank by</span>
        <div class="picker" id="rankby" style="width:250px"></div>
        <span class="spacer"></span>
        <span id="rprogress" class="muted"></span>
        <button class="btn gold" id="rankrun">Rank</button>
        <button class="btn" id="rankstop" style="display:none">Stop</button>
      </div>
    </div>
    <div class="filterbar" id="talbar" style="display:none">
      <div class="frow">
        <span class="flabel">Method</span>
        <div class="picker" id="talmethod" style="width:310px"></div>
        <span class="flabel" id="taltargetlabel">Pick</span>
        <div class="picker" id="taltarget" style="width:290px"></div>
        <span class="flabel">Talismans</span>
        <input id="talcount" type="number" min="1" max="5000" step="100" style="width:92px">
        <span class="flabel">Score with</span>
        <div class="picker" id="talpreset" style="width:250px" title="Skill weights of a Ranking preset"></div>
      </div>
      <div class="frow">
        <span class="flabel">Skill 1</span>
        <div class="picker" id="tals1" style="width:250px"></div>
        <div class="picker" id="tals1lv" style="width:78px"></div>
        <span class="flabel">Skill 2</span>
        <div class="picker" id="tals2" style="width:250px"></div>
        <div class="picker" id="tals2lv" style="width:78px"></div>
        <span class="flabel">Slots at least</span>
        <div class="picker slotpick" id="talslot0"></div>
        <div class="picker slotpick" id="talslot1"></div>
        <div class="picker slotpick" id="talslot2"></div>
        <button class="btn" id="talclear" style="display:none">Clear filters</button>
      </div>
    </div>
    <div class="filterbar" id="filterbar">
      <div class="frow">
        <span class="flabel">Skill</span>
        <div class="picker" id="skillpick" style="width:290px"></div>
        <span class="flabel">Lv</span>
        <div class="picker" id="levelpick" style="width:78px"></div>
        <button class="btn gold" id="addskill" title="Also require this skill (AND)">Add</button>
        <button class="btn" id="orskill" title="Accept this skill instead of the last one added (OR)">Or</button>
        <span id="wanted" class="wantlist"></span>
      </div>
      <div class="frow">
        <span class="flabel">Slots at least</span>
        <div class="picker slotpick" id="slot0"></div>
        <div class="picker slotpick" id="slot1"></div>
        <div class="picker slotpick" id="slot2"></div>
        <span class="flabel">Defense ≥</span>
        <input id="mindef" type="number" step="1" placeholder="any" style="width:76px">
        <label class="toggle"><input type="checkbox" id="noloss"><span></span>No skill loss</label>
        <label class="toggle"><input type="checkbox" id="noneg"><span></span>No negative resistance</label>
        <span class="spacer"></span>
        <span id="progress" class="muted"></span>
        <button class="btn gold" id="searchall" style="display:none">Search</button>
        <button class="btn" id="stop" style="display:none">Stop</button>
        <button class="btn" id="clear" style="display:none">Clear filters</button>
      </div>
    </div>
    <div class="table" id="table"></div>
  </section>
</main>
<div id="status"></div>
<div class="modal" id="modal" style="display:none">
  <div class="frame box">
    <h2 id="modaltitle"></h2>
    <textarea id="modaltext" spellcheck="false"></textarea>
    <div class="frow"><span id="modalnote" class="muted small"></span><span class="spacer"></span>
      <button class="btn gold" id="modalok"></button><button class="btn" id="modalclose">Close</button></div>
  </div>
</div>
<div class="loading" id="loading">Reading game data…</div>

<script>
const ITEM_COLORS = {0:"#ffffff",1:"#ffffff",2:"#aeaeae",3:"#f072b8",4:"#ffff70",5:"#ffb356",6:"#ff721f",7:"#ff4c17",
  8:"#2ce095",9:"#a443e0",10:"#486eff",11:"#5aa9ff",12:"#9fccff",13:"#9a7751",14:"#9ac183",15:"#ca0000",16:"#007bca",17:"#a800a8"};
const PARTS = ["head", "chest", "arms", "waist", "legs"];
const ELEMENTS = ["fire", "water", "thunder", "ice", "dragon"];
const S = { icons: {}, settings: {}, armors: [], skills: [], pred: null, all: null, mode: "piece" };
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Game icons are grayscale masks the game tints: color × luminance, alpha kept (like the game). */
function mask(name, color, title, cls = "") {
  const src = S.icons[name];
  if (!src) return `<span class="ico ${cls}" title="${esc(title || name)}" style="background:${color};border-radius:50%"></span>`;
  return `<span class="tint ${cls}" title="${esc(title || name)}"><span style="background:${color};-webkit-mask-image:url(${src})"></span><img src="${src}" alt=""></span>`;
}
function img(name, title, cls = "") {
  const src = S.icons[name];
  return src ? `<img class="img ${cls}" src="${src}" title="${esc(title || name)}" alt="">` : `<span class="${cls}">${esc(title || name)}</span>`;
}
const skillIcon = (color, title, cls = "") => mask("skill", ITEM_COLORS[color] || "#fff", title, cls);
function slot(lv, up) {
  if (!lv) return `<span class="slot-empty" title="no slot"></span>`;
  return mask("slot" + lv, up ? "var(--up)" : "#efe6d2", `Lv${lv} slot${up ? " (qurious)" : ""}`);
}
const signed = v => `<span class="val ${v > 0 ? "pos" : v < 0 ? "neg" : "zero"}">${v > 0 ? "+" + v : v}</span>`;
const status = t => $("status").textContent = t;

/* ---- filters --------------------------------------------------------------------------------- */
/* skills = AND of OR groups: [[{id, level}, ...], ...]; level = minimum level on the piece after the augment. */
const EMPTY_FILTERS = { skills: [], slots: [0, 0, 0], minDef: null, noSkillLoss: false, noNegRes: false };
const LIST_DEFAULTS = { ownedOnly: false, rarity: 0, part: -1 };
// The Ranking tab has its own filters; the other two tabs share theirs.
const FKEY = () => S.mode === "rank" ? "rankFilters" : "filters";
const F = () => S.settings[FKEY()];
const L = () => S.settings.list;
const filtering = () => {
  const f = F();
  return f.skills.length > 0 || f.slots.some(x => x) || f.minDef !== null || f.noSkillLoss || f.noNegRes;
};
const groupsOf = skills => (skills || []).map(g => Array.isArray(g) ? g : [g]).filter(g => g.length);

/* Styled dropdown: items [{value, html, text}] ; opts {search, placeholder, onChange} */
function makePicker(el, opts) {
  const p = { el, items: [], value: null, opts };
  el.innerHTML = `<div class="picker-btn" tabindex="0"></div>`;
  const btn = el.firstChild;
  const close = () => { el.classList.remove("open"); el.querySelector(".picker-pop")?.remove(); };
  const choose = v => { p.set(v); close(); opts.onChange && opts.onChange(v); };
  function open() {
    document.querySelectorAll(".picker.open").forEach(x => { if (x !== el) { x.classList.remove("open"); x.querySelector(".picker-pop")?.remove(); } });
    el.classList.add("open");
    const pop = document.createElement("div");
    pop.className = "picker-pop";
    pop.innerHTML = (opts.search ? `<input type="text" placeholder="Search…">` : "") + `<div class="picker-list"></div>`;
    el.appendChild(pop);
    const list = pop.querySelector(".picker-list"), input = pop.querySelector("input");
    let shown = [], active = 0;
    const draw = () => {
      const q = input ? input.value.trim().toLowerCase() : "";
      shown = p.items.filter(i => !q || i.text.toLowerCase().includes(q));
      active = Math.max(0, Math.min(active, shown.length - 1));
      list.innerHTML = shown.map((i, k) => `<div class="picker-item ${k === active ? "active" : ""} ${i.value === p.value ? "sel" : ""} ${i.disabled ? "disabled" : ""}" data-k="${k}" title="${esc(i.title || "")}">${i.html}</div>`).join("")
        || `<div class="picker-empty">Nothing found</div>`;
      list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
    };
    list.addEventListener("mousedown", e => { const it = e.target.closest(".picker-item"); if (it) { e.preventDefault(); if (!shown[+it.dataset.k].disabled) choose(shown[+it.dataset.k].value); } });
    const keys = e => {
      if (e.key === "ArrowDown") { active++; draw(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { active--; draw(); e.preventDefault(); }
      else if (e.key === "Enter" && shown[active] && !shown[active].disabled) { choose(shown[active].value); e.preventDefault(); }
      else if (e.key === "Escape") close();
    };
    (input || btn).addEventListener("keydown", keys);
    if (input) { input.addEventListener("input", () => { active = 0; draw(); }); setTimeout(() => input.focus(), 0); }
    active = Math.max(0, p.items.findIndex(i => i.value === p.value));
    draw();
  }
  btn.addEventListener("click", () => el.classList.contains("open") ? close() : open());
  btn.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === "ArrowDown") && !el.classList.contains("open")) { open(); e.preventDefault(); } });
  document.addEventListener("mousedown", e => { if (!el.contains(e.target)) close(); });
  p.setItems = (items, value) => { p.items = items; p.set(value !== undefined ? value : p.value); };
  p.set = v => {
    p.value = v;
    const it = p.items.find(i => i.value === v);
    btn.innerHTML = it ? it.html : `<span class="ph">${esc(opts.placeholder || "Select…")}</span>`;
  };
  return p;
}

const skillItem = s => ({ value: s.id, text: s.name, title: s.qurious ? "" : "Qurious never adds this skill: only pieces that already have it can match",
  html: `${skillIcon(s.color, s.name)}<span>${esc(s.name)}</span>${s.qurious ? "" : `<span class="hint">armor only</span>`}` });
const slotItems = () => [{ value: 0, text: "any", html: `<span class="muted">any</span>` }]
  .concat([1, 2, 3, 4].map(l => ({ value: l, text: "Lv" + l, html: `${slot(l, false)}<span>Lv${l}</span>` })));
let skillPick, levelPick, slotPicks;

function setupFilters() {
  skillPick = makePicker($("skillpick"), { search: true, placeholder: "Choose a skill…", onChange: updateLevels });
  levelPick = makePicker($("levelpick"), {});
  slotPicks = [0, 1, 2].map(i => makePicker($("slot" + i), {
    onChange: v => { const s = [...F().slots]; s[i] = v; setFilters({ slots: s }); }
  }));
  $("addskill").addEventListener("click", () => addSkill(false));
  $("orskill").addEventListener("click", () => addSkill(true));
  let t = null;
  $("mindef").addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => { const v = $("mindef").value.trim(); setFilters({ minDef: v === "" ? null : parseInt(v) }); }, 500);
  });
  $("noloss").addEventListener("change", () => setFilters({ noSkillLoss: $("noloss").checked }));
  $("noneg").addEventListener("change", () => setFilters({ noNegRes: $("noneg").checked }));
  $("clear").addEventListener("click", () => setFilters({ ...EMPTY_FILTERS }));
  $("stop").addEventListener("click", () => api().find_cancel());
  $("searchall").addEventListener("click", startAll);
}

function updateLevels() {
  const s = S.skills.find(x => x.id === skillPick.value);
  const max = s ? s.max : 1;
  const a = S.mode === "piece" ? S.armors.find(x => x.id === S.settings.armor) : null;
  const have = s && a ? (a.skills.find(k => k.id === s.id) || { level: 0 }).level : 0;
  // One augment can raise the same skill more than once (seen in game), so every level up to the
  // skill's max is possible; levels far above the piece's own are just rarer.
  const items = [...Array(max).keys()].map(i => {
    const lv = i + 1;
    const hint = !a ? "" : lv <= have ? "on piece" : lv > have + 1 ? "rare" : "";
    return { value: lv, text: "Lv" + lv,
      html: `<span>≥ Lv ${lv}</span>${hint ? `<span class="hint">${hint}</span>` : ""}` };
  });
  levelPick.setItems(items, a ? Math.min(Math.max(1, have + 1), max) : 1);
}

function syncFilterUi() {
  const f = F();
  slotPicks.forEach((p, i) => p.setItems(slotItems(), f.slots[i] || 0));
  $("mindef").value = f.minDef === null ? "" : f.minDef;
  $("noloss").checked = !!f.noSkillLoss;
  $("noneg").checked = !!f.noNegRes;
  $("orskill").disabled = !f.skills.length;
  $("orskill").style.opacity = f.skills.length ? 1 : .45;
  $("wanted").innerHTML = f.skills.map((g, gi) => `<span class="want">${g.map((w, wi) => {
    const s = S.skills.find(x => x.id === w.id) || { name: "#" + w.id, color: 0 };
    return `${wi ? `<span class="or">or</span>` : ""}${skillIcon(s.color, s.name)}${esc(s.name)}<b style="color:var(--gold);margin-left:4px">≥ Lv${w.level}</b><button data-unwant="${gi}:${wi}" title="Remove">✕</button>`;
  }).join("")}</span>`).join(`<span class="and">and</span>`);
  showSearchUi();
}

function setFilters(patch) {
  const key = FKEY();
  S.settings[key] = { ...F(), ...patch };
  api().save_settings({ [key]: S.settings[key] });
  syncFilterUi();
  filtersChanged();
}

function addSkill(asOr) {
  if (skillPick.value === null) { status("Choose a skill first."); return; }
  const w = { id: skillPick.value, level: levelPick.value || 1 };
  const groups = F().skills.map(g => g.filter(x => x.id !== w.id)).filter(g => g.length);
  if (asOr && groups.length) groups[groups.length - 1].push(w); else groups.push([w]);
  setFilters({ skills: groups });
}

function removeSkill(gi, wi) {
  const groups = F().skills.map((g, i) => i === gi ? g.filter((_, j) => j !== wi) : g).filter(g => g.length);
  setFilters({ skills: groups });
}

/* ---- app ----------------------------------------------------------------------------------------- */
async function boot() {
  const r = await api().init();
  $("loading").style.display = "none";
  if (r.error) { status(r.error); return; }
  Object.assign(S, { icons: r.icons, settings: r.settings, types: r.types });
  for (const key of ["filters", "rankFilters"]) {
    S.settings[key] = { ...EMPTY_FILTERS, ...(S.settings[key] || {}) };
    S.settings[key].skills = groupsOf(S.settings[key].skills);
  }
  S.settings.list = { ...LIST_DEFAULTS, ...(S.settings.list || {}) };
  S.mode = ["all", "rank", "talisman"].includes(S.settings.mode) ? S.settings.mode : "piece";
  $("rolls").value = S.settings.rolls;
  $("ownedonly").checked = $("rownedonly").checked = !!L().ownedOnly;
  $("rankdepth").value = S.settings.rankDepth || 200;
  $("lang").innerHTML = r.langs.map(l => `<option ${l === S.settings.lang ? "selected" : ""}>${l}</option>`).join("");
  $("hunter").innerHTML = r.hunters.map(h =>
    `<option value="${h.key}">${esc(h.name)} — HR ${h.hr} / MR ${h.mr} (slot ${h.slot}${h.persona ? ", " + esc(h.persona) : ""})</option>`).join("");
  if (r.hunters.some(h => h.key === S.settings.hunter)) $("hunter").value = S.settings.hunter;
  if (!S.types.some(t => t.id === S.settings.type)) S.settings.type = S.types[0].id;
  setupFilters();
  setupRanking();
  await loadSkills();
  await loadPresets();
  await setupTalismans();
  renderParts(); renderModes(); syncFilterUi();
  if (r.hunters.length) await loadHunter(); else status("No MH Rise save found on this PC.");
}

async function loadSkills() {
  S.skills = await api().skills();
  skillPick.setItems(S.skills.map(skillItem), skillPick.value);
  updateLevels();
}

async function loadHunter() {
  status("Reading save…");
  await stopJob();
  const r = await api().load_hunter($("hunter").value);
  if (r.error) { status(r.error); return; }
  S.armors = r.armors;
  S.all = null;
  renderRarities(); renderArmors();
  const owned = S.armors.filter(a => a.count).length;
  status(`${S.armors.length} qurious-capable armor pieces in the game, ${owned} crafted. Predictions follow the save as it is now: after augmenting, save in game and press Reload save.`);
  if (S.mode === "all") return showMode();
  if (S.mode === "talisman") { showMode(); return runTal(); }
  const keep = S.armors.find(a => a.id === S.settings.armor);
  if (keep) await selectArmor(keep.id); else { S.pred = null; showMode(); }
}

function saveList(patch) {
  S.settings.list = { ...L(), ...patch };
  api().save_settings({ list: S.settings.list });
}

function renderParts() {
  $("parts").innerHTML = $("rparts").innerHTML = `<span class="chip ${L().part < 0 ? "on" : ""}" data-part="-1">All</span>` +
    PARTS.map((p, i) => `<span class="chip ${L().part === i ? "on" : ""}" data-part="${i}" title="${p}">${mask(p, "var(--gold)", p)}</span>`).join("");
}

function renderRarities() {
  const rars = [...new Set(S.armors.map(a => a.rarity))].sort((a, b) => b - a);
  if (L().rarity && !rars.includes(L().rarity)) saveList({ rarity: 0 });
  $("rarities").innerHTML = $("rrarities").innerHTML = [0, ...rars].map(r => `<span class="chip ${L().rarity === r ? "on" : ""}" data-rarity="${r}">${r ? "Rarity " + r : "All"}</span>`).join("");
}

function listedArmors() {
  // The ranking tab shows part, rarity and "Crafted only" but not the text search, so it ignores it.
  const q = S.mode === "rank" ? "" : $("afilter").value.trim().toLowerCase(), l = L();
  return S.armors.filter(a => (l.part < 0 || a.part === l.part) && (!l.rarity || a.rarity === l.rarity)
    && (!l.ownedOnly || a.count > 0)
    && (!q || a.name.toLowerCase().includes(q) || a.skills.some(s => s.name.toLowerCase().includes(q))));
}

function renderArmors() {
  const list = listedArmors();
  $("listtitle").textContent = `Armor (${list.length})`;
  let html = "", group = null;
  for (const a of list) {
    if (a.rarity !== group) {
      group = a.rarity;
      const n = list.filter(x => x.rarity === group).length, costs = [...new Set(list.filter(x => x.rarity === group).map(x => x.cost))].sort((x, y) => x - y);
      html += `<div class="group">Rarity ${group}<span>${n} pieces · augment cost ${costs.join(", ")}</span></div>`;
    }
    html += `
    <div class="armor ${S.mode === "piece" && a.id === S.settings.armor ? "sel" : ""}" data-id="${a.id}">
      ${mask(PARTS[a.part], "var(--gold)", PARTS[a.part])}
      <div style="min-width:0">
        <div class="nm">${esc(a.name)}</div>
        <div class="askills">${a.skills.map(s => `<span class="sk">${skillIcon(s.color, s.name)}${esc(s.name)} <b>${s.level}</b></span>`).join("") || `<span class="muted">no skills</span>`}</div>
      </div>
      <div style="text-align:right">
        <div class="sub" style="justify-content:flex-end">${a.slots.map(l => slot(l, false)).join("")}</div>
        ${a.count ? `<div class="own" title="Crafted">✓ ×${a.count}</div>` : ""}
      </div>
    </div>`;
  }
  $("armors").innerHTML = html || `<div class="empty">No armor matches.</div>`;
}

/* ---- modes ----------------------------------------------------------------------------------------- */
function renderModes() {
  const rank = S.mode === "rank", tal = S.mode === "talisman";
  document.querySelectorAll(".mode").forEach(m => m.classList.toggle("on", m.dataset.mode === S.mode));
  $("tabs").style.display = S.mode === "piece" ? "" : "none";
  $("listcol").style.display = rank || tal ? "none" : "";
  $("presetcol").style.display = rank ? "" : "none";
  $("filterbar").style.display = tal ? "none" : "";
  $("rankbar").style.display = rank ? "" : "none";
  $("talbar").style.display = tal ? "" : "none";
  document.querySelector("main").style.gridTemplateColumns = tal ? "minmax(0, 1fr)" : "";
  $("rolls").style.display = document.querySelector('label[for="rolls"]').style.display = tal ? "none" : "";
}

async function setMode(mode) {
  if (mode === S.mode) return;
  await stopJob();
  S.mode = mode; api().save_settings({ mode });
  renderModes(); renderArmors(); updateLevels();
  if (mode === "piece" && S.settings.armor && S.armors.some(a => a.id === S.settings.armor)) return selectArmor(S.settings.armor);
  showMode();
  if (mode === "talisman") { syncTalUi(); runTal(); }
}

function showMode() {
  renderModes(); syncFilterUi(); showSearchUi(); renderHead(); renderTabs(); renderTable();
}

function filtersChanged() {
  if (S.mode === "piece") { if (S.settings.armor) selectArmor(S.settings.armor); }
  else if (S.mode === "all") { if (S.all) S.all.stale = true; showSearchUi(); renderHead(); }
  else rankStale();
}

/* ---- piece mode: either the next N rolls (no filter) or a search that runs until it finds matches ---- */
async function selectArmor(id) {
  S.settings.armor = id;
  renderArmors();
  document.querySelector("#armors .armor.sel")?.scrollIntoView({ block: "nearest" });
  updateLevels();
  S.error = null;
  if (filtering()) return startFind();
  await stopJob();
  status("Simulating…");
  const n = Math.max(1, Math.min(1000, parseInt($("rolls").value) || 200));
  const r = await api().predict(id, n);
  if (r.error) { status(r.error); return; }
  S.pred = r;
  status(`Next ${n} rolls per augment option.`);
  showMode();
}

let pollTimer = null;
async function stopJob() {
  clearInterval(pollTimer); pollTimer = null;
  S.searching = false; S.job = null;
  await api().find_cancel();
}

function startPolling(job) {
  S.job = job; S.searching = true;
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 350);
}

async function startFind() {
  if (!S.settings.armor) return;
  await stopJob();
  const r = await api().find_start(S.settings.armor, F(), 50);
  if (r.error) {
    S.pred = null; S.error = r.error; status(r.error); showMode(); return;
  }
  S.error = null;
  const types = {};
  for (const t of S.types) types[t.id] = { rolls: [], scanned: 0, ended: true, impossible: true };
  r.streams.forEach(s => Object.assign(types[s.type], { ended: false, impossible: false }));
  S.pred = { types, search: true, sameCost: "…" };
  startPolling({ kind: "piece", since: 0, streams: r.streams });
  status("Searching… every augment option advances together, results appear as they are found (up to 50 each).");
  showMode();
}

async function startAll() {
  const ids = listedArmors().map(a => a.id);
  await stopJob();
  const r = await api().scan_all_start(ids, F());
  if (r.error) { S.all = { error: r.error, results: [] }; status(r.error); showMode(); return; }
  S.all = { results: [], pieces: ids.length, streams: r.streams.length, depth: 0, total: 0, done: false, stale: false };
  startPolling({ kind: "all", since: 0, streams: r.streams });
  status(`Searching ${ids.length} pieces × augment options on every CPU core; closest results first.`);
  showMode();
}

async function poll() {
  const job = S.job;
  if (!job) return;
  const r = await api().find_status(job.since);
  if (job !== S.job) return;
  job.since += r.events.length;
  if (job.kind === "piece") {
    for (const e of r.events) S.pred.types[e.type].rolls.push(e.row);
    for (const [k, st] of Object.entries(r.streams)) {
      const tp = S.pred.types[job.streams[k].type];
      tp.scanned = st.scanned; tp.ended = st.ended;
    }
    S.pred.total = r.total;
  } else if (job.kind === "rank") {
    for (const e of r.events) S.rank.byKey[e.key] = e;  // each stream's best roll so far
    Object.assign(S.rank, { total: r.total, done: r.done });
  } else {
    for (const e of r.events) S.all.results.push(e);
    if (r.events.length) S.all.results.sort((a, b) => a.n - b.n);
    Object.assign(S.all, { depth: r.depth, total: r.total, done: r.done, found: S.all.results.length });
  }
  if (r.done) {
    clearInterval(pollTimer); pollTimer = null;
    S.searching = false;
    status(`Search ${r.cancelled ? "stopped" : "finished"}: ${r.total.toLocaleString()} rolls simulated.`);
  }
  showSearchUi(); renderTabs(); renderHead();
  const empty = job.kind === "piece" ? !S.pred.types[S.settings.type].rolls.length
    : job.kind === "rank" ? !Object.keys(S.rank.byKey).length : !S.all.results.length;
  if (r.events.length || r.done || empty) renderTable();
}

function showSearchUi() {
  $("stop").style.display = S.searching && S.job && S.job.kind !== "rank" ? "" : "none";
  $("clear").style.display = filtering() ? "" : "none";
  $("searchall").style.display = S.mode === "all" ? "" : "none";
  $("searchall").textContent = S.all && !S.all.stale && !S.searching && S.all.results ? "Search again" : "Search";
  let p = "";
  if (S.searching && S.job && S.job.kind === "piece") p = `Scanned ${(S.pred.total || 0).toLocaleString()} rolls…`;
  if (S.searching && S.job && S.job.kind === "all") p = !S.all.total ? "Starting search on every CPU core…" : `Every piece checked up to ${S.all.depth.toLocaleString()} rolls · ${S.all.total.toLocaleString()} simulated`;
  $("progress").textContent = p;
  const ranking = S.searching && S.job && S.job.kind === "rank";
  $("rankstop").style.display = ranking ? "" : "none";
  $("rankrun").textContent = S.rank && !S.rank.stale && !ranking && !S.rank.error ? "Rank again" : "Rank";
  $("rprogress").textContent = !ranking ? "" : !S.rank.total ? "Starting on every CPU core…"
    : `${S.rank.total.toLocaleString()} of ${(S.rank.streams * S.rank.depth).toLocaleString()} rolls`;
}

function renderHead() {
  if (S.mode === "talisman") return renderTalHead();
  if (S.mode === "rank") return renderRankHead();
  if (S.mode === "all") {
    const n = listedArmors().length, a = S.all;
    let note = `Finds, for every armor piece listed on the left and every augment option, the closest roll that passes the
      filters, using all CPU cores. Wanted skills must be added by the augment itself (pieces that already have
      them are not listed at 1 roll). <b>Rolls</b> = n means n−1 augments of that same piece and option first (pieces with the same
      augment cost share the sequence).`;
    if (a && a.stale) note += ` <b style="color:var(--gold)">Filters or list changed: press Search again.</b>`;
    else if (a && a.done && !a.error) note += ` Every piece without a result was checked up to ${a.depth.toLocaleString()} rolls.`;
    $("head").innerHTML = `<span class="big">All listed armor</span><span class="rar">${n} pieces</span>
      ${L().ownedOnly ? `<span class="rar">crafted only</span>` : ""}${L().rarity ? `<span class="rar">Rarity ${L().rarity}</span>` : ""}
      <div class="note">${note}</div>`;
    return;
  }
  const a = S.armors.find(x => x.id === S.settings.armor);
  if (!a) { $("head").innerHTML = `<span class="muted">Select an armor piece.</span>`; return; }
  const t = S.settings.type, tp = S.types.find(x => x.id === t);
  const seed = S.pred && S.pred.types[t] && S.pred.types[t].seed !== undefined ? S.pred.types[t].seed : "";
  const same = S.armors.filter(x => x.count && x.cost === a.cost).length;
  $("head").innerHTML = `
    ${mask(PARTS[a.part], "var(--gold)", PARTS[a.part])}<span class="big">${esc(a.name)}</span>
    <span>${a.slots.map(l => slot(l, false)).join("")}</span>
    <span>${a.skills.map(s => `<span class="sk">${skillIcon(s.color, s.name)}<span>${esc(s.name)} Lv${s.level}</span></span>`).join("")}</span>
    <span class="rar">Rarity ${a.rarity}</span><span class="cost">Cost ${a.cost}</span>
    ${a.count ? `<span class="own">✓ crafted ×${a.count}</span>` : `<span class="muted">not crafted yet</span>`}
    <div class="note"><b>Rolls</b> = 1 is the next "${esc(tp.name)}" on this piece, 2 the one after, and so on. This sequence${seed !== "" ? ` (generator ${seed})` : ""} is shared by every
      armor piece with cost ${a.cost} and the same augment option (${same} crafted in your box). Augmenting any of them
      moves it forward, so reload the save after each augment. Other options and costs are independent.</div>`;
}

function renderTabs() {
  if (S.mode !== "piece") { $("tabs").innerHTML = ""; return; }
  $("tabs").innerHTML = (S.types || []).map(t => {
    let badge = "";
    const tp = S.pred && S.pred.search && S.pred.types[t.id];
    if (filtering() && tp) {
      if (tp.impossible) badge = `<span class="badge" style="color:var(--dim)">never</span>`;
      else badge = `<span class="badge" title="matches found · rolls until the first one">${tp.rolls.length}${tp.ended ? "" : "…"}${tp.rolls.length ? " · " + tp.rolls[0].n.toLocaleString() + " rolls" : ""}</span>`;
    }
    return `<span class="tab ${t.id === S.settings.type ? "on" : ""}" data-type="${t.id}">${esc(t.name)}${badge}</span>`;
  }).join("");
}

const rowCells = (r, ws) => `
  <td>${img(r.def < 0 ? "defense_down" : "defense", "Defense", r.def ? "" : "off")} ${signed(r.def)}</td>
  <td class="slots">${r.slots.map(s => slot(s.lv, s.up)).join("")}</td>
  <td>${r.res.map((v, i) => `<span class="res">${img(ELEMENTS[i], ELEMENTS[i], v ? "" : "off")}${signed(v)}</span>`).join("")}</td>
  <td class="skills">${r.skills.map(s => `<span class="sk ${ws.has(s.id) && s.v > 0 ? "wanted" : ""}">${skillIcon(s.color, s.name)}<span class="nm">${esc(s.name)}</span>${signed(s.v)}</span>`).join("")}</td>`;
const wantedIds = () => new Set(F().skills.flat().map(w => w.id));
const MAX_ALL_ROWS = 400;

function renderTable() {
  $("table").classList.remove("all");
  if (S.mode === "talisman") return renderTalTable();
  if (S.mode === "all") return renderAllTable();
  if (S.mode === "rank") return renderRankTable();
  if (S.error && filtering()) {
    $("table").innerHTML = `<div class="empty" style="color:var(--down)">${esc(S.error)}</div>`;
    return;
  }
  if (!S.pred || (filtering() && !S.pred.search)) {
    $("table").innerHTML = `<div class="empty">${S.searching ? "Searching…" : "Pick an armor piece on the left."}</div>`;
    return;
  }
  const tp = S.pred.types[S.settings.type];
  const rows = tp.rolls;
  if (!rows.length) {
    const why = tp.impossible ? `"${S.types.find(x => x.id === S.settings.type).name}" can never pass these filters on this piece${S.settings.type === 3 ? " (it never adds skills)" : ""}.`
      : !tp.ended ? `Searching… ${tp.scanned.toLocaleString()} rolls checked, no match yet.`
      : `None of the next ${tp.scanned.toLocaleString()} rolls passes the filters.`;
    $("table").innerHTML = `<div class="empty">${why}</div>`;
    return;
  }
  const ws = wantedIds();
  $("table").innerHTML = `<table><thead><tr><th title="Augments of this piece and option until this result (1 = the next one)">Rolls</th><th>Defense</th><th>Slots</th><th>Resistances</th><th>Skills</th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${filtering() ? "match" : ""}"><td class="n">${r.n.toLocaleString()}</td>${rowCells(r, ws)}</tr>`).join("")
    + `</tbody></table>`;
}

function renderAllTable() {
  const a = S.all;
  $("table").classList.add("all");
  if (!a) {
    $("table").innerHTML = `<div class="empty">${filtering() ? "Press <b>Search</b> to look through every armor piece listed on the left."
      : "Add a filter above (for example a skill), then press <b>Search</b>."}</div>`;
    return;
  }
  if (a.error) { $("table").innerHTML = `<div class="empty" style="color:var(--down)">${esc(a.error)}</div>`; return; }
  if (!a.results.length) {
    $("table").innerHTML = `<div class="empty">${a.done ? "No piece reached a match." : "Searching…"}</div>`;
    return;
  }
  const ws = wantedIds(), byId = Object.fromEntries(S.armors.map(x => [x.id, x]));
  const typeName = id => S.types.find(t => t.id === id).name;
  const rows = a.results.slice(0, MAX_ALL_ROWS);
  $("table").innerHTML = `<table><thead><tr><th title="Augments of this piece and option until this result (1 = the next one)">Rolls</th><th>Armor · option</th><th>Defense</th><th>Slots</th><th>Resistances</th><th>Skills</th></tr></thead><tbody>` +
    rows.map(e => {
      const arm = byId[e.armor] || { name: e.armor, part: 0, rarity: "?" };
      return `<tr class="match click" data-goto="${e.armor}:${e.type}" title="Open this piece">
        <td class="n">${e.n.toLocaleString()}</td>
        <td class="arm">${mask(PARTS[arm.part], "var(--gold)", PARTS[arm.part])} <span class="nm">${esc(arm.name)}</span>
          <span class="muted"> R${arm.rarity}</span>${arm.count ? ` <span class="own">✓</span>` : ""}
          <div class="opt">${esc(typeName(e.type))}</div>
          <div class="base" title="Slots and skills the piece already has"><span class="bslots">${(arm.slots || []).map(l => slot(l, false)).join("")}</span>${(arm.skills || []).map(s => `<span class="sk">${skillIcon(s.color, s.name)}${esc(s.name)} ${s.level}</span>`).join("")}</div></td>${rowCells(e.row, ws)}</tr>`;
    }).join("") + `</tbody></table>` +
    (a.results.length > MAX_ALL_ROWS ? `<div class="empty">Showing the closest ${MAX_ALL_ROWS} of ${a.results.length.toLocaleString()} results.</div>` : "");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-id],[data-part],[data-rarity],[data-type],[data-unwant],[data-mode],[data-goto]");
  if (!el) return;
  if (el.dataset.id) { if (S.mode !== "piece") { S.settings.armor = el.dataset.id; setMode("piece"); } else selectArmor(el.dataset.id); }
  else if (el.dataset.part !== undefined) { saveList({ part: +el.dataset.part }); renderParts(); listChanged(); }
  else if (el.dataset.rarity !== undefined) { saveList({ rarity: +el.dataset.rarity }); renderRarities(); listChanged(); }
  else if (el.dataset.mode) setMode(el.dataset.mode);
  else if (el.dataset.goto) {
    const [id, t] = el.dataset.goto.split(":");
    S.settings.type = +t; api().save_settings({ type: S.settings.type });
    S.settings.armor = id; setMode("piece");
  }
  else if (el.dataset.type !== undefined) {
    S.settings.type = +el.dataset.type; api().save_settings({ type: S.settings.type });
    renderHead(); renderTabs(); renderTable();
  }
  else if (el.dataset.unwant !== undefined) { const [g, w] = el.dataset.unwant.split(":").map(Number); removeSkill(g, w); }
});
function listChanged() {

  if (S.mode === "rank") rankStale();
}
$("afilter").addEventListener("input", listChanged);
for (const id of ["ownedonly", "rownedonly"]) $(id).addEventListener("change", () => {

});
$("hunter").addEventListener("change", loadHunter);
$("reload").addEventListener("click", loadHunter);
$("rolls").addEventListener("change", () => {

$("lang").addEventListener("change", async () => {
