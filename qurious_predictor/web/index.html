$("gamedir").addEventListener("click", async () => { if (await api().choose_game_dir()) location.reload(); });

/* ---- ranking tab: presets ------------------------------------------------------------------------- */
let presetPick, rankByPick, saveTimer = null;
const P = { builtin: [], user: [], skills: [], defaultSlots: [7, 8, 9, 12] };
const allPresets = () => P.builtin.concat(P.user);
const currentPreset = () => allPresets().find(p => p.id === S.settings.preset) || allPresets()[0];
const RANK_BY = [
  { value: "score", text: "Best piece after the augment", html: "Best piece after the augment" },
  { value: "gain", text: "Best augment (gain)", html: "Best augment (gain over the piece)" },
];

function setupRanking() {
  presetPick = makePicker($("presetpick"), { search: true, placeholder: "Choose a preset…",
    onChange: v => { S.settings.preset = v; api().save_settings({ preset: v }); renderPreset(); rankStale(); } });
  rankByPick = makePicker($("rankby"), { onChange: v => { S.settings.rankBy = v; api().save_settings({ rankBy: v }); renderRankTable(); } });
  rankByPick.setItems(RANK_BY, S.settings.rankBy === "gain" ? "gain" : "score");
  $("pnew").addEventListener("click", () => addPreset({ name: "New preset", weights: {}, slots: [0, 0, 0, 0], defense: 0 }));
  $("pclone").addEventListener("click", () => {
    const p = currentPreset();
    addPreset({ name: p.name + " (copy)", weights: { ...p.weights }, slots: [...p.slots], defense: p.defense || 0 });
  });
  $("pdelete").addEventListener("click", () => {
    const p = currentPreset();
    if (p.builtin || !confirm(`Delete the preset "${p.name}"?`)) return;
    P.user = P.user.filter(x => x.id !== p.id);
    S.settings.preset = allPresets()[0].id; api().save_settings({ preset: S.settings.preset });
    savePresets(); renderPresetPicker(); renderPreset(); rankStale();
  });
  $("pexport").addEventListener("click", async () => {
    const text = await api().preset_export(currentPreset());
    openModal("Export preset", text, "Copy", async () => { await copyText($("modaltext")); $("modalnote").textContent = "Copied to the clipboard."; },
      "Copy this text to share the preset or keep a backup.");
  });
  $("pimport").addEventListener("click", () => openModal("Import preset", "", "Import", async () => {
    const r = await api().preset_import($("modaltext").value);
    if (r.error) { $("modalnote").textContent = r.error; return; }
    addPreset(r.preset);
    closeModal();
    status(r.unknown.length ? `Preset imported; ${r.unknown.length} line(s) not recognised: ${r.unknown.slice(0, 3).join(" | ")}` : "Preset imported.");
  }, "Paste a preset exported by this app (or edited by hand: \"skill Attack Boost = 10\")."));
  $("presetname").addEventListener("input", () => editPreset(p => { p.name = $("presetname").value || "Unnamed preset"; }, false));
  $("presetname").addEventListener("change", renderPresetPicker);
  ["sw0", "sw1", "sw2", "sw3"].forEach((id, i) => $(id).addEventListener("input", () => editPreset(p => { p.slots[i] = num($(id).value); })));
  $("dw").addEventListener("input", () => editPreset(p => { p.defense = num($("dw").value); }));
  $("pskfilter").addEventListener("input", renderPresetSkills);
  $("weightedonly").addEventListener("change", renderPresetSkills);
  $("pskills").addEventListener("input", e => {
    const inp = e.target.closest("input[data-skill]");
    if (!inp) return;
    editPreset(p => { setWeight(p, inp.dataset.skill, num(inp.value)); });
    inp.classList.toggle("set", num(inp.value) !== 0);
  });
  $("pskills").addEventListener("click", e => {
    const b = e.target.closest("[data-tierw]");
    if (!b || currentPreset().builtin) return;
    editPreset(p => { setWeight(p, b.dataset.tierw, +b.dataset.w); });
    renderPresetSkills();
  });
  $("rankrun").addEventListener("click", startRank);
  $("rtypes").addEventListener("click", e => { const c = e.target.closest("[data-rtype]"); if (c) toggleRankType(+c.dataset.rtype); });
  $("rminscore").value = S.settings.rankMinScore ?? "";
  $("rminscore").addEventListener("input", () => {
    S.settings.rankMinScore = minScore(); api().save_settings({ rankMinScore: S.settings.rankMinScore });
    if (S.mode === "rank") renderRankTable();
  });
  $("table").addEventListener("click", e => {
    const h = e.target.closest("[data-rsort]");
    if (h) { e.stopPropagation(); setRankSort(h.dataset.rsort); }
  });
  renderRankTypes();
  $("rankstop").addEventListener("click", () => api().find_cancel());
  $("rankdepth").addEventListener("change", () => {
    S.settings.rankDepth = Math.max(1, Math.min(100000, parseInt($("rankdepth").value) || 200));
    $("rankdepth").value = S.settings.rankDepth; api().save_settings({ rankDepth: S.settings.rankDepth }); rankStale();
  });
  $("modalclose").addEventListener("click", closeModal);
}

const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : 0; };
function setWeight(p, sid, w) { if (w) p.weights[sid] = w; else delete p.weights[sid]; }

async function loadPresets() {
  Object.assign(P, await api().presets());
  if (!allPresets().some(p => p.id === S.settings.preset)) S.settings.preset = allPresets()[0].id;
  renderPresetPicker(); renderPreset();
}

function renderPresetPicker() {
  presetPick.setItems(allPresets().map(p => ({ value: p.id, text: p.name,
    html: `<span>${esc(p.name)}</span>${p.builtin ? `<span class="hint">built-in</span>` : ""}` })), S.settings.preset);
}

function renderPreset() {
  const p = currentPreset(), ro = !!p.builtin;
  $("presetname").value = p.name; $("presetname").disabled = ro;
  ["sw0", "sw1", "sw2", "sw3"].forEach((id, i) => { $(id).value = p.slots[i]; $(id).disabled = ro; });
  $("dw").value = p.defense || 0; $("dw").disabled = ro;
  $("pdelete").disabled = ro; $("pdelete").style.opacity = ro ? .45 : 1;
  const n = Object.values(p.weights).filter(w => w).length;
  $("presetnote").innerHTML = (ro ? "Built-in preset (read-only): <b>Clone</b> it to change weights. " : "")
    + `${n} weighted skills. Weights count per skill level on the piece after the augment; losing a skill loses its weight.`;
  renderPresetSkills();
}

function renderPresetSkills() {
  const p = currentPreset(), ro = !!p.builtin;
  const q = $("pskfilter").value.trim().toLowerCase(), only = $("weightedonly").checked;
  const list = P.skills.filter(s => (!q || s.name.toLowerCase().includes(q) || s.tierLabel.toLowerCase().includes(q))
    && (!only || p.weights[s.id]))
    .sort((a, b) => (p.weights[b.id] || 0) - (p.weights[a.id] || 0) || a.name.localeCompare(b.name));
  $("pskills").innerHTML = list.map(s => {
    const w = p.weights[s.id] || 0;
    return `<div class="pskill ${ro ? "ro" : ""}" title="${esc(s.name)}: up to Lv${s.max}${s.qurious ? ", qurious can add it" : ", qurious never adds it"}">
      ${skillIcon(s.color, s.name)}
      <div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="tier">${esc(s.tierLabel)}</div></div>
      <input type="number" step="0.5" data-skill="${s.id}" value="${w}" class="${w ? "set" : ""}" ${ro ? "disabled" : ""}>
      ${ro ? "" : `<button class="reset" data-tierw="${s.id}" data-w="${s.tierWeight}" title="Use the default weight of this tier">= ${s.tierWeight}</button>`}
    </div>`;
  }).join("") || `<div class="empty">No skill matches.</div>`;
}

function addPreset(src) {
  const p = { id: "user:" + Date.now().toString(36), builtin: false, name: src.name, weights: { ...src.weights },
    slots: [...src.slots], defense: src.defense || 0 };
  P.user.push(p);
  S.settings.preset = p.id; api().save_settings({ preset: p.id });
  savePresets(); renderPresetPicker(); renderPreset(); rankStale();
}

function editPreset(fn, stale = true) {
  const p = currentPreset();
  if (p.builtin) return;
  fn(p);
  savePresets();
  if (stale) rankStale();
}

function savePresets() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => api().save_presets(P.user), 400);
}

/* ---- import / export dialog ---- */
let modalAction = null;
function openModal(title, text, okLabel, action, note) {
  $("modaltitle").textContent = title; $("modaltext").value = text; $("modalok").textContent = okLabel;
  $("modalnote").textContent = note || ""; modalAction = action;
  $("modal").style.display = "";
  setTimeout(() => { $("modaltext").focus(); if (text) $("modaltext").select(); }, 0);
}
function closeModal() { $("modal").style.display = "none"; modalAction = null; }
$("modalok").addEventListener("click", () => modalAction && modalAction());
async function copyText(area) {
  try { await navigator.clipboard.writeText(area.value); return; } catch (e) { /* fall back below */ }
  area.focus(); area.select(); document.execCommand("copy");
}

/* ---- ranking tab: run and show ---- */
function rankStale() {
  if (S.rank && !S.rank.error) S.rank.stale = true;
  if (S.mode === "rank") { renderRankHead(); showSearchUi(); }
}

async function startRank() {
  const ids = listedArmors().map(a => a.id), depth = parseInt($("rankdepth").value) || 200;
  await stopJob();
  const r = await api().rank_start(ids, currentPreset(), depth, filtering() ? F() : null, rankTypes());
  if (r.error) { S.rank = { error: r.error, byKey: {} }; status(r.error); showMode(); return; }
  S.rank = { byKey: {}, pieces: ids.length, streams: r.streams.length, depth: r.depth, total: 0, done: false, stale: false,
    preset: currentPreset().name, weights: { ...currentPreset().weights }, filtered: filtering() };
  startPolling({ kind: "rank", since: 0, streams: r.streams });
  status(`Ranking the next ${r.depth} rolls of every augment option on ${ids.length} pieces…`);
  showMode();
}

function renderRankHead() {
  const n = listedArmors().length, p = currentPreset(), r = S.rank;
  let note = `Scores the next rolls of every augment option on the listed pieces with the preset's weights and keeps the
    best roll of each piece and option. <b>Score</b> = the piece after the augment (its own skills, gains and losses, slots);
    <b>Gain</b> = how much the augment adds or removes. Click a row to open that piece.`;
  if (filtering()) note += ` Only rolls that pass the filters below are ranked (skill levels count the piece's own skills).`;
  if (r && r.stale) note += ` <b style="color:var(--gold)">Preset or pieces changed: press Rank again.</b>`;
  $("head").innerHTML = `<span class="big">Ranking</span><span class="rar">${esc(p.name)}</span><span class="rar">${n} pieces</span>
    <div class="note">${note}</div>`;
}

const SHORT_TYPES = { 0: "Augment", 3: "Stability", 1: "Skills+", 2: "Slots+" };
const rankTypes = () => S.settings.rankTypes || S.types.map(t => t.id);
function renderRankTypes() {
  const on = new Set(rankTypes());
  $("rtypes").innerHTML = S.types.map(t => `<span class="chip ${on.has(t.id) ? "on" : ""}" data-rtype="${t.id}" title="${esc(t.name)}">${esc(SHORT_TYPES[t.id] || t.name)}</span>`).join("");
}
function toggleRankType(id) {
  const on = new Set(rankTypes());
  if (on.has(id)) { if (on.size === 1) return; on.delete(id); } else on.add(id);
  S.settings.rankTypes = S.types.map(t => t.id).filter(t => on.has(t));
  api().save_settings({ rankTypes: S.settings.rankTypes });
  renderRankTypes(); rankStale();
}
const rankSort = () => S.settings.rankSort || { key: "rank", dir: 1 };
function setRankSort(key) {
  const cur = rankSort();
  // Rank and Rolls read best ascending; Score and Gain descending. A second click reverses.
  const first = key === "rank" || key === "n" ? 1 : -1;
  S.settings.rankSort = { key, dir: cur.key === key ? -cur.dir : first };
  api().save_settings({ rankSort: S.settings.rankSort });
  renderRankTable();
}
const minScore = () => { const v = parseFloat(String($("rminscore").value).replace(",", ".")); return isFinite(v) ? v : null; };

function renderRankTable() {
  const r = S.rank;
  if (!r) { $("table").innerHTML = `<div class="empty">Pick a preset on the left, then press <b>Rank</b>.</div>`; return; }
  if (r.error) { $("table").innerHTML = `<div class="empty" style="color:var(--down)">${esc(r.error)}</div>`; return; }
  const by = S.settings.rankBy === "gain" ? "gain" : "score";
  // Rank = position by the "Rank by" value over every result; the min score and the column sort
  // only hide and reorder rows, so a row keeps its rank.
  const ranked = Object.values(r.byKey).sort((a, b) => b[by] - a[by] || a.n - b.n);
  ranked.forEach((e, i) => { e.rank = i + 1; });
  const min = minScore(), sort = rankSort();
  const val = e => sort.key === "rank" ? e.rank : sort.key === "n" ? e.n : e[sort.key];
  const shown = ranked.filter(e => min === null || e.score >= min)
    .sort((a, b) => (val(a) - val(b)) * sort.dir || a.rank - b.rank);
  const rows = shown.slice(0, MAX_ALL_ROWS);
  if (!rows.length) {
    const why = !r.done && !ranked.length ? "Ranking…"
      : ranked.length ? `No result has a score of ${min} or more.`
      : r.filtered ? `No roll passes the filters in the next ${r.depth.toLocaleString()} rolls of the listed pieces.`
      : "Nothing to rank.";
    $("table").innerHTML = `<div class="empty">${why}</div>`;
    return;
  }
  $("table").classList.add("all");
  const byId = Object.fromEntries(S.armors.map(x => [x.id, x]));
  const typeName = id => S.types.find(t => t.id === id).name;
  const fmt = v => (Math.round(v * 10) / 10).toLocaleString();
  const th = (key, label, title, align) => `<th class="click" data-rsort="${key}" title="${esc(title)}"${align ? ` style="text-align:${align}"` : ""}>${label}${sort.key === key ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  $("table").innerHTML = `<table><thead><tr>${th("rank", "Rank", `Position by ${by}; click to sort`)}`
    + th("score", "Score", "The piece after the augment; click to sort", "right")
    + th("gain", "Gain", "What the augment adds or removes; click to sort", "right")
    + th("n", "Rolls", "Augments of this piece and option until this result (1 = the next one); click to sort")
    + `<th>Armor · option</th><th>Defense</th><th>Slots</th><th>Resistances</th><th>Skills</th></tr></thead><tbody>` +
    rows.map(e => {
      const arm = byId[e.armor] || { name: e.armor, part: 0, rarity: "?", skills: [] };
      const skills = e.row.skills.map(s => `<span class="sk ${r.weights[s.id] ? "wanted" : ""}" title="${r.weights[s.id] ? "weight " + r.weights[s.id] : "not in the preset"}">${skillIcon(s.color, s.name)}<span class="nm">${esc(s.name)}</span>${signed(s.v)}</span>`).join("");
      return `<tr class="click" data-goto="${e.armor}:${e.type}" title="Open this piece">
        <td class="n">${e.rank}</td><td class="sc">${fmt(e.score)}</td>
        <td class="gn"><span class="${e.gain > 0 ? "pos" : e.gain < 0 ? "neg" : "zero"}">${e.gain > 0 ? "+" : ""}${fmt(e.gain)}</span></td>
        <td class="n">${e.n.toLocaleString()}</td>
        <td class="arm">${mask(PARTS[arm.part], "var(--gold)", PARTS[arm.part])} <span class="nm">${esc(arm.name)}</span>
          <span class="muted"> R${arm.rarity}</span>${arm.count ? ` <span class="own">✓</span>` : ""}
          <div class="opt">${esc(typeName(e.type))}</div>
          <div class="base" title="Slots and skills the piece already has"><span class="bslots">${(arm.slots || []).map(l => slot(l, false)).join("")}</span>${(arm.skills || []).map(s => `<span class="sk">${skillIcon(s.color, s.name)}${esc(s.name)} ${s.level}</span>`).join("")}</div></td>
        <td>${img(e.row.def < 0 ? "defense_down" : "defense", "Defense", e.row.def ? "" : "off")} ${signed(e.row.def)}</td>
        <td class="slots">${e.row.slots.map(x => slot(x.lv, x.up)).join("")}</td>
        <td>${e.row.res.map((v, k) => `<span class="res">${img(ELEMENTS[k], ELEMENTS[k], v ? "" : "off")}${signed(v)}</span>`).join("")}</td>
        <td class="skills">${skills}</td></tr>`;
    }).join("") + `</tbody></table>`
    + (shown.length > MAX_ALL_ROWS ? `<div class="empty">Showing ${MAX_ALL_ROWS} of ${shown.length.toLocaleString()} piece/option results.</div>` : "")
    + (min !== null && shown.length < ranked.length ? `<div class="empty">${(ranked.length - shown.length).toLocaleString()} results below score ${min} hidden.</div>` : "");
}

/* ---- talismans tab: melding pot ------------------------------------------------------------------- */
// Filter: up to two wanted skills (a talisman has at most two; null = any skill) and minimum slots.
const TAL_DEFAULT_FILTER = { s1: { id: null, level: 1 }, s2: { id: null, level: 1 }, slots: [0, 0, 0] };
const TAL_MAX_ROWS = 1000;
let talMethodPick, talTargetPick, talPresetPick, talSkillPicks, talLevelPicks, talSlotPicks;
const TF = () => S.settings.talFilter;
const talMethod = () => (S.talMethods || []).find(m => m.id === S.settings.talMethod) || (S.talMethods || [])[0];
const talTarget = m => {
  if (!m || !m.targeted) return null;
  const t = (S.settings.talTargets || {})[m.id];
  return m.targets.some(x => x.id === t) ? t : m.targets[0].id;
};
const talPreset = () => allPresets().find(p => p.id === S.settings.talPreset) || allPresets()[0];
const talSort = () => S.settings.talSort || { key: "n", dir: 1 };

async function setupTalismans() {
  S.talMethods = await api().talisman_methods();
  const f = S.settings.talFilter || {};
  S.settings.talFilter = { s1: { ...TAL_DEFAULT_FILTER.s1, ...(f.s1 || {}) }, s2: { ...TAL_DEFAULT_FILTER.s2, ...(f.s2 || {}) },
    slots: Array.isArray(f.slots) ? f.slots : [0, 0, 0] };
  talMethodPick = makePicker($("talmethod"), { onChange: v => { S.settings.talMethod = v; syncTalUi(); runTal(); } });
  talTargetPick = makePicker($("taltarget"), { search: true, placeholder: "Pick a skill…", onChange: v => {
    S.settings.talTargets = { ...(S.settings.talTargets || {}), [talMethod().id]: v }; runTal(); } });
  talPresetPick = makePicker($("talpreset"), { search: true, onChange: v => {
    S.settings.talPreset = v; api().save_settings({ talPreset: v }); runTal(); } });
  talSkillPicks = ["s1", "s2"].map(k => makePicker($("tal" + k), { search: true, placeholder: "any skill", onChange: v => {
    setTalFilter({ [k]: { id: v, level: 1 } }); syncTalUi(); } }));
  talLevelPicks = ["s1", "s2"].map(k => makePicker($("tal" + k + "lv"), { onChange: v => setTalFilter({ [k]: { ...TF()[k], level: v } }) }));
  talSlotPicks = [0, 1, 2].map(i => makePicker($("talslot" + i), {
    onChange: v => { const s = [...TF().slots]; s[i] = v; setTalFilter({ slots: s }); } }));
  $("talcount").value = S.settings.talCount || 1000;
  $("talcount").addEventListener("change", runTal);
  $("talclear").addEventListener("click", () => { setTalFilter(JSON.parse(JSON.stringify(TAL_DEFAULT_FILTER))); syncTalUi(); });
  $("table").addEventListener("click", e => {
    const h = e.target.closest("[data-tsort]");
    if (!h) return;
    e.stopPropagation();
    const key = h.dataset.tsort, cur = talSort();
    const first = key === "n" || key === "rank" ? 1 : -1;  // Talisman and Rank read best ascending
    S.settings.talSort = { key, dir: cur.key === key ? -cur.dir : first };
    api().save_settings({ talSort: S.settings.talSort });
    renderTalTable();
  });
  syncTalUi();
}

function syncTalUi() {
  const m = talMethod();
  talMethodPick.setItems(S.talMethods.map(x => ({ value: x.id, text: x.name,
    html: `<span>${esc(x.name)}</span><span class="hint">${x.targeted ? "pick a skill" : "random"}</span>` })), m.id);
  $("taltarget").style.display = $("taltargetlabel").style.display = m.targeted ? "" : "none";
  if (m.targeted) talTargetPick.setItems(m.targets.map(t => ({ value: t.id, text: t.name,
    html: `${skillIcon(t.color, t.name)}<span>${esc(t.name)}</span><span class="hint">${t.pickRate}% · grade ${t.grade}</span>` })), talTarget(m));
  talPresetPick.setItems(allPresets().map(p => ({ value: p.id, text: p.name, html: `<span>${esc(p.name)}</span>` })), talPreset().id);
  const f = TF();
  ["s1", "s2"].forEach((k, i) => {
    talSkillPicks[i].setItems([{ value: null, text: "any skill", html: `<span class="muted">any skill</span>` }]
      .concat(S.skills.map(s => ({ value: s.id, text: s.name, html: `${skillIcon(s.color, s.name)}<span>${esc(s.name)}</span>`
        + (m.possible.includes(s.id) ? "" : `<span class="hint">never with this method</span>`) }))), f[k].id);
    const sk = S.skills.find(s => s.id === f[k].id);
    talLevelPicks[i].setItems([...Array(sk ? sk.max : 1).keys()].map(j => ({ value: j + 1, text: "Lv" + (j + 1), html: `<span>≥ Lv ${j + 1}</span>` })), f[k].level || 1);
    $("tal" + k + "lv").style.display = sk ? "" : "none";
  });
  talSlotPicks.forEach((p, i) => p.setItems(slotItems(), f.slots[i] || 0));
  $("talclear").style.display = talFiltering() ? "" : "none";
}

function setTalFilter(patch) {
  S.settings.talFilter = { ...TF(), ...patch };
  api().save_settings({ talFilter: S.settings.talFilter });
  $("talclear").style.display = talFiltering() ? "" : "none";
  renderTalHead(); renderTalTable();
}

const talFiltering = () => { const f = TF(); return f.s1.id !== null || f.s2.id !== null || f.slots.some(x => x); };
function talMatch(t) {
  const f = TF();
  // The two wanted skills must be two different skills of the talisman, in either position.
  const want = [f.s1, f.s2].filter(w => w.id !== null);
  const used = new Set();
  for (const w of want) {
    const k = t.skills.findIndex((s, i) => !used.has(i) && s.id === w.id && s.level >= (w.level || 1));
    if (k < 0) return false;
    used.add(k);
  }
  const need = [...f.slots].sort((a, b) => b - a);
  return need.every((lv, i) => t.slots[i] >= lv);
}

async function runTal() {
  const m = talMethod();
  if (!m) return;
  const n = Math.max(1, Math.min(5000, parseInt($("talcount").value) || 1000));
  status("Simulating talismans…");
  const r = await api().talisman_predict(m.id, talTarget(m), n, talPreset());
  S.tal = r.error ? { error: r.error } : { rows: r.talismans };
  status(r.error || `Next ${n} talismans of ${m.name}, as the save is now.`);
  renderTalHead(); renderTalTable();
}

function renderTalHead() {
  const m = talMethod();
  if (!m) return;
  const t = m.targeted ? m.targets.find(x => x.id === talTarget(m)) : null;
  let note = `<b>Talisman</b> 1 is the next talisman this method makes, 2 the one after, and so on, however many
    talismans each meld gives or which materials you use: every method has its own sequence in the save, and only
    melding with that method moves it. Reload the save after melding. <b>Score</b>: skills and slots weighted by the
    preset (like the Ranking tab); <b>Rank</b>: its place by score among these talismans. <b>Perfection</b>: skill and
    slot levels against the best talisman with the same skills (100% = god charm).`;
  if (t && t.pickRate < 100) note += ` The skill you pick sticks ${t.pickRate}% of the time; otherwise a random skill takes its place (marked <i>missed</i>).`;
  if (m.id === 11) note += ` Cyclus replaces a second skill equal to the picked one in a way the save cannot tell (marked <i>?</i>).`;
  const f = TF();
  for (const w of [f.s1, f.s2]) {
    if (w.id !== null && !m.possible.includes(w.id)) note += ` <b style="color:var(--down)">${esc((S.skills.find(s => s.id === w.id) || {}).name || "")} never comes out of this method.</b>`;
  }
  if (S.tal && S.tal.rows && talFiltering()) {
    const hits = S.tal.rows.filter(talMatch);
    note += hits.length ? ` <b style="color:var(--up)">${hits.length} of the next ${S.tal.rows.length} talismans match; the first is talisman ${hits[0].n}.</b>`
      : ` <b style="color:var(--down)">None of the next ${S.tal.rows.length} talismans matches: raise the number of talismans.</b>`;
  }
  $("head").innerHTML = `<span class="big">${esc(m.name)}</span>
    ${t ? `<span class="sk">${skillIcon(t.color, t.name)}<span>${esc(t.name)}</span></span><span class="rar">${t.pickRate}% · grade ${t.grade}</span>` : `<span class="rar">random skills</span>`}
    <div class="note">${note}</div>`;
}

function perfCell(t) {
  const p = Math.round(t.perfection * 100);
  const [b1, b2, bs] = t.best;
  const l1 = t.skills[0] ? t.skills[0].level : 0, l2 = t.skills[1] ? t.skills[1].level : 0;
  const sl = t.slots.reduce((a, b) => a + b, 0);
  const hue = Math.round(120 * t.perfection);  // red → yellow → green
  const tip = `Skill 1 Lv${l1} of ${b1} · Skill 2 Lv${l2} of ${b2} · slot levels ${sl} of ${bs}`;
  const seg = (v, max) => max ? `<span class="pseg" style="--f:${Math.round(100 * v / max)}%"></span>` : "";
  return `<div class="perf" title="${tip}">
    <div class="pbar"><span style="width:${p}%;background:hsl(${hue} 70% 45%)"></span></div>
    ${p >= 100 ? `<span class="god">GOD</span>` : `<span class="pct">${p}%</span>`}
    <div class="psegs">${seg(l1, b1)}${seg(l2, b2)}${seg(sl, bs)}</div></div>`;
}

function renderTalTable() {
  const r = S.tal;
  if (!r) { $("table").innerHTML = `<div class="empty">Simulating…</div>`; return; }
  if (r.error) { $("table").innerHTML = `<div class="empty" style="color:var(--down)">${esc(r.error)}</div>`; return; }
  const filtering = talFiltering(), f = TF();
  let rows = filtering ? r.rows.filter(talMatch) : r.rows.slice();
  if (!rows.length) { $("table").innerHTML = `<div class="empty">None of the next ${r.rows.length} talismans matches.</div>`; return; }
  const sort = talSort();
  rows.sort((a, b) => ((sort.key === "n" ? a.n - b.n : sort.key === "rank" ? a.rank - b.rank
    : sort.key === "score" ? a.score - b.score : a.perfection - b.perfection) * sort.dir) || a.n - b.n);
  const wanted = new Set([f.s1.id, f.s2.id].filter(x => x !== null));
  const cell = s => s ? `<span class="sk ${wanted.has(s.id) ? "wanted" : ""}">${skillIcon(s.color, s.name)}<span class="nm">${esc(s.name)}</span> <b style="color:var(--gold)">Lv${s.level}</b></span>` : `<span class="muted">—</span>`;
  const th = (key, label, title, align) => `<th class="click" data-tsort="${key}" title="${esc(title)}"${align ? ` style="text-align:${align}"` : ""}>${label}${sort.key === key ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const shown = rows.slice(0, TAL_MAX_ROWS);
  $("table").innerHTML = `<table><thead><tr>${th("n", "Talisman", "Talismans this method makes until this one (1 = the next one); click to sort")}`
    + th("rank", "Rank", "Place by score among these talismans; click to sort")
    + th("score", "Score", "Skills and slots weighted by the preset; click to sort", "right")
    + th("perfection", "Perfection", "Skill and slot levels against the best talisman with the same skills; click to sort")
    + `<th>Skill 1</th><th>Skill 2</th><th>Slots</th><th>Note</th></tr></thead><tbody>` +
    shown.map(t => `<tr><td class="n">${t.n.toLocaleString()}</td><td class="n">${t.rank.toLocaleString()}</td>
      <td class="sc">${t.score.toLocaleString()}</td><td>${perfCell(t)}</td>
      <td>${cell(t.skills[0])}</td><td>${t.unsure ? `<span class="muted" title="Replaced in a way the save cannot predict">? (replaced)</span>` : cell(t.skills[1])}</td>
      <td class="slots">${t.slots.map(l => slot(l, false)).join("")}</td>
      <td class="muted">${t.missed ? "missed: random skill 1" : ""}</td></tr>`).join("") + `</tbody></table>`
    + (rows.length > TAL_MAX_ROWS ? `<div class="empty">Showing ${TAL_MAX_ROWS} of ${rows.length.toLocaleString()} talismans; sort or filter to see others.</div>` : "");
}

window.addEventListener("pywebviewready", boot);
</script>
</body>
